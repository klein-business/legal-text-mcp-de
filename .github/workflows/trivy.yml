name: Trivy

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image (local only)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: legal-text-mcp-de:trivy-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: Trivy runs informationally. The SARIF output is uploaded
      # to GitHub Code Scanning (when the repo is public and has GHAS)
      # for triaged review. The action is set to exit 0 to avoid blocking
      # CI on transient CVE-DB differences between local and CI scanners.
      # If a real HIGH/CRITICAL CVE appears in the SARIF, address it via
      # base-image bump, package update, or documented .trivyignore entry.
      - name: Run Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: legal-text-mcp-de:trivy-scan
          severity: HIGH,CRITICAL
          exit-code: "0" # informational only; SARIF upload + GitHub Code Scanning gates production view
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore

      - name: Upload Trivy results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always() && github.event.repository.private == false
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
